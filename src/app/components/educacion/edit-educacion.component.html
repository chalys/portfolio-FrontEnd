<app-header></app-header>
<br>
<header class="masthead text-center">
    <div class="container" *ngIf="educacion && isLogged">
        <!-- Contact Section Heading-->
        <h2 class="page-section-heading text-center text-uppercase text-secondary mb-0">
            Editar Institucion
        </h2>
        <br>
        <!-- Contact Section Form-->
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <form class="was-validated needs-validation" id="contactForm" (ngSubmit)="onUpdate()" novalidate
                    #f="ngForm">

                    <!-- Id educacion-->
                    <div class="form-floating mb-3" [hidden]="true">
                        <input class="form-control" id="ideducacion" name="ideducacion" type="text" required
                            [(ngModel)]="educacion.ideducacion" disabled="true" />
                        <label for="name">ID</label>
                    </div>

                    <!-- Nombre de la institucion-->
                    <div class="form-floating mb-3">
                        <input class="form-control" id="nombreE" name="nombreE" type="text"
                            placeholder="Ingrese el nombre de la institucion" required
                            [(ngModel)]="educacion.nombreE" />
                        <label for="nombreE">Nombre de la institucion</label>
                        <!-- Mensajes para validación -->
                        <div class="invalid-feedback">
                            Este campo es obligatorio
                        </div>
                    </div>

                    <!-- Descripcion-->
                    <div class="form-floating mb-3">
                        <textarea class="form-control" id="descripcion" name="descripcion" type="text"
                            placeholder="Escriba una descripcion" style="height: 10rem"
                            [(ngModel)]="educacion.descripcion" required></textarea>
                        <label for="descripcion">Descripcion</label>
                        <!-- Mensajes para validación -->
                        <div class="invalid-feedback">
                            Este campo es obligatorio
                        </div>
                    </div>

                    <!-- Fecha de Inicio-->
                    <div class="form-floating mb-3">
                        <input class="form-control" id="fechaInicio" name="fechaInicio" type="date"
                            placeholder="Fecha de inicio" required [(ngModel)]="educacion.fecha_inicio" />
                        <label for="fechaInicio">Fecha de inicio</label>
                        <!-- Mensajes para validación -->
                        <div class="invalid-feedback">
                            La fecha no es valida
                        </div>
                    </div>

                    <!-- Fecha de Final-->
                    <div class="form-floating mb-3">
                        <input class="form-control" id="fechaFin" name="fechaFin" type="date" placeholder="Fecha Final"
                            required [(ngModel)]="educacion.fecha_fin" />
                        <label for="fechaInicio">Fecha Final</label>
                    </div>

                    <!-- Logo Institucion -->
                    <div class="form-floating mb-3">
                        <input type="file" id="imgEdu" class=" form-control" name="imgEdu" (change)="uploadImage($event)"
                            accept="jpg jpeg png">
                        <label for="imgEdu">Logo de Institucion</label>
                        <div class="invalid-feedback">Logo no válido</div>
                    </div>
                    <!-- <div class="form-outline mb-2">
                        <img id="logo-edu" [src]="educacion.logo_institucion_url" style="width: 200px; height: 200px;"><br>
                        <label for="imgEdu">Logo seleccionado</label>
                    </div> -->

                    <!-- Button Save & Cancel-->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <button class="btn btn-primary btn-lg" id="guardar" type="submit" name="guardar"
                            title="Guardar Institucion">GUARDAR</button>
                        <button class="btn btn-secondary btn-lg" id="cancelar" type="button" name="cancelar"
                            title="Cancelar" onclick="window.location.href='/'">CANCELAR</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</header>
<br>
<app-footer></app-footer>
