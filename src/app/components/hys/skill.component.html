<section class="page-section portfolio" id="portfolio">
  <div class="container">
    <!-- Portfolio Section Heading-->
    <h2 class="page-section-heading text-center text-uppercase text-secondary mb-0">
      Hard & Soft skills
    </h2>
    <button type="button" class="btn btn-outline-dark" title="Agregar experiencia" routerLink="/newskill"
      *ngIf="isLogged">
      <i class="bi bi-plus-circle-fill"></i>
    </button>
    <br />
    <br />
    <div class="row">
      <div class="text-center col-sm-4 cold-md-4 col-lg-4" *ngFor="let HardSkill of skill">
        <circle-progress [percent]="HardSkill.porcentaje" [radius]="100" [title]="HardSkill.nombreH"
          [titleFontSize]="'2em'" [showUnits]="false" [showSubtitle]="false" [outerStrokeWidth]="10"
          [innerStrokeWidth]="2" [outerStrokeColor]="'#1abc9c'" [innerStrokeColor]="'#2c3e50'" [animation]="true"
          [animationDuration]="600"></circle-progress>
        <br />
        <div class="gap-2 d-md-flex justify-content-md-center mb-2" *ngIf="isLogged">
          <button class="btn btn-primary" type="button" title="Editar skill"
            routerLink="/editskill/{{HardSkill.idskill}}">
            <i class="bi bi-pencil-fill"></i>
          </button>
          <button class="btn btn-secondary" type="button" title="Eliminar skill" (click)="delete(HardSkill.idskill)">
            <i class="bi bi-trash-fill"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
