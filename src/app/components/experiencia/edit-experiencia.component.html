<app-header></app-header>
<br>
<header class="masthead text-center">
  <div class="container" *ngIf="expLab && isLogged">
    <!-- Contact Section Heading-->
    <h2 class="page-section-heading text-center text-uppercase text-secondary mb-0">
      Editar Experiencia
    </h2>
    <br>
    <!-- Contact Section Form-->
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <form class="was-validated needs-validation" id="contactForm" (ngSubmit)="onUpdate()" novalidate #f="ngForm">
          
          <!-- Id experiencia-->
          <div class="form-floating mb-3" [hidden]="true">
            <input class="form-control" id="idexperiencia" name="idexperiencia" type="text" required
              [(ngModel)]="expLab.idexperiencia" disabled="true" />
            <label for="name">ID</label>
          </div>

          <!-- Nombre de la empresa-->
          <div class="form-floating mb-3">
            <input class="form-control" id="nombreE" name="nombreE" type="text"
              placeholder="Ingrese el nombre de la empresa" required [(ngModel)]="expLab.nombreE" />
            <label for="nombreE">Nombre de la empresa</label>
            <!-- Mensajes para validación -->
            <div class="invalid-feedback">
              Este campo es obligatorio
            </div>
          </div>

          <!-- Descripcion-->
          <div class="form-floating mb-3">
            <textarea class="form-control" id="descripcion" name="descripcion" type="text"
              placeholder="Escriba una descripcion" style="height: 10rem" [(ngModel)]="expLab.descripcion"
              required></textarea>
            <label for="descripcion">Descripcion</label>
            <!-- Mensajes para validación -->
            <div class="invalid-feedback">
              Este campo es obligatorio
            </div>
          </div>

          <!-- Fecha de Inicio-->
          <div class="form-floating mb-3">
            <input class="form-control" id="fechaInicio" name="fechaInicio" type="date" placeholder="Fecha de inicio"
              required [(ngModel)]="expLab.fecha_inicio" />
            <label for="fechaInicio">Fecha de inicio</label>
            <!-- Mensajes para validación -->
            <div class="invalid-feedback">
              La fecha no es valida
            </div>
          </div>

          <!-- Fecha de Final-->
          <div class="form-floating mb-3">
            <input class="form-control" id="fechaFin" name="fechaFin" type="date" placeholder="Fecha Final"
            required  [(ngModel)]="expLab.fecha_fin" />
            <label for="fechaInicio">Fecha Final</label>
          </div>

          <!-- Submit Button-->
          <div>
            <button class="btn btn-primary btn-xl" id="submitButton" type="submit" name="button" title="Enviar">
              ENVIAR
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</header>
<br>
<app-footer></app-footer>
