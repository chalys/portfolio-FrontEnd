<app-header></app-header>
<br>
<header class="masthead text-center">
  <div class="container" *ngIf="isLogged">
    <!-- Contact Section Heading-->
    <h2 class="page-section-heading text-center text-uppercase text-secondary mb-0">
      Nueva Experiencia
    </h2>
    <br>
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <form class="was-validated needs-validation" id="contactForm" (ngSubmit)="onCreate()" novalidate #f="ngForm">

          <!-- Nombre de Empresa -->
          <div class="form-floating mb-3">
            <input class="form-control" id="nombreE" name="nombreE" type="text"
              placeholder="Ingrese el nombre de la empresa" required [(ngModel)]="nombreE" />
            <label for="nombreE" class="form-label">Nombre de la empresa</label>
            <!-- Mensajes para validación -->
            <div class="invalid-feedback">
              Este campo es obligatorio
            </div>
          </div>

          <!-- Descripción -->
          <div class="form-floating mb-3">
            <textarea class="form-control" id="descripcion" type="text" placeholder="Escriba una descripcion"
              style="height: 10rem" [(ngModel)]="descripcion" name="descripcion" required></textarea>
            <label for="descripcion">Descripcion</label>
            <!-- Mensajes para validación -->
            <div class="invalid-feedback">
              Este campo es obligatorio
            </div>
          </div>

          <!-- Fecha de Inicio-->
          <div class="form-floating mb-3">
            <input class="form-control" id="fecha_inicio" name="fecha_inicio" type="date" placeholder="Fecha de inicio"
              required [(ngModel)]="fecha_inicio" />
            <label for="fecha_inicio">Fecha de inicio</label>
            <!-- Mensajes para validación -->
            <div class="invalid-feedback">
              La fecha no es valida
            </div>
          </div>

          <!-- Fecha de Final-->
          <div class="form-floating mb-3">
            <input class="form-control" id="fecha_fin" name="fecha_fin" type="date" placeholder="Fecha Final" required
              [(ngModel)]="fecha_fin" />
            <label for="fecha_fin">Fecha Final</label>
          </div>

          <div>
            <!-- Button New & Cancel-->
            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
              <button class="btn btn-primary btn-lg" id="guardar" type="submit" name="guardar"
                title="Agregar experiencia">AGREGAR</button>
              <button class="btn btn-secondary btn-lg" id="cancelar" type="button" name="cancelar" title="Cancelar"
                onclick="window.location.href='/'">CANCELAR</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</header>
<br>
<app-footer></app-footer>
