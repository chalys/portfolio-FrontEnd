<app-header></app-header>
<header class="masthead text-center">
  <div class="container" *ngIf="isLogged">
    <!-- Contact Section Heading-->
    <h2
      class="page-section-heading text-center text-uppercase text-secondary mb-0"
    >
      Nueva Experiencia
    </h2>
    <!-- Icon Divider-->
    <div class="divider-custom">
      <div class="divider-custom-line"></div>
      <div class="divider-custom-icon"><i class="fas fa-star"></i></div>
      <div class="divider-custom-line"></div>
    </div>

    <!-- Contact Section Form-->
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <form id="contactForm" (ngSubmit)="onCreate()" novalidate #f="ngForm">
          <!-- Id Persona-->

          <!-- <div class="form-floating mb-3" [hidden]="true">
            <input
              class="form-control"
              id="idPersona"
              name="idPersona"
              type="number"
              data-sb-validations="required"
              [(ngModel)]="NPersona"
              value="{{ NPersona }}"
              disabled="true"
            />
            <label for="name">Persona</label>
          </div> -->

          <!-- Nombre de la empresa-->
          <div class="form-floating mb-3">
            <input
              class="form-control"
              id="nombreE"
              name="nombreE"
              type="text"
              placeholder="Ingrese el nombre de la empresa"
              data-sb-validations="required"
              [(ngModel)]="nombreE"
            />
            <label for="name">Nombre de la empresa</label>
            <div class="invalid-feedback" data-sb-feedback="nombreE:required">
              Este campo es obligatorio
            </div>
          </div>

          <!-- Descripcion-->
          <div class="form-floating mb-3">
            <textarea
              class="form-control"
              id="descripcion"
              type="text"
              placeholder="Escriba una descripción"
              style="height: 10rem"
              [(ngModel)]="descripcion"
              name="descripcion"
            ></textarea>
            <label for="descripcion">Descripcion</label>
          </div>

          <!-- Fecha de Inicio-->
          <div class="form-floating mb-3">
            <input
              class="form-control"
              id="fecha_inicio"
              name="fecha_inicio"
              type="date"
              placeholder="Fecha de inicio"
              data-sb-validations="required,fecha_inicio"
              [(ngModel)]="fecha_inicio"
            />
            <label for="fecha_inicio">Fecha de inicio</label>
            <div
              class="invalid-feedback"
              data-sb-feedback="fecha_inicio:required"
            >
              Este campo es obligatorio
            </div>
            <div
              class="invalid-feedback"
              data-sb-feedback="fecha_inicio:fecha_inicio"
            >
              La fecha no es valida
            </div>
          </div>
          <!-- Fecha de Final-->
          <div class="form-floating mb-3">
            <input
              class="form-control"
              id="fecha_fin"
              name="fecha_fin"
              type="date"
              placeholder="Fecha Final"
              data-sb-validations="fecha_fin"
              [(ngModel)]="fecha_fin"
            />
            <label for="fecha_fin">Fecha Final</label>

            <div
              class="invalid-feedback"
              data-sb-feedback="fecha_fin:fecha_fin"
            >
              La fecha no es valida
            </div>
          </div>
          <!-- Submit Button-->
          <div *ngIf="!IsLoadding; else ButtonLoadding">
            <button
              class="btn btn-primary btn-xl"
              id="submitButton"
              type="submit"
              title="Enviar"
            >
              ENVIAR
            </button>
          </div>

          <ng-template #ButtonLoadding>
            <button class="btn btn-primary btn-xl" id="submitButton" disabled>
              <span
                class="spinner-border spinner-border-sm"
                role="status"
                aria-hidden="true"
              ></span>
              ENVIANDO...
            </button>
          </ng-template>
        </form>
      </div>
    </div>
  </div>
</header>
<app-footer></app-footer>
